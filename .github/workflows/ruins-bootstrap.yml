name: Install original arcade sources
on:
  push:
    branches:
      - feature/ruins-of-second-sun
    paths:
      - 'metal-slug-2/bootstrap/**'
      - '.github/workflows/ruins-bootstrap.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and restore repository-scoped source bundle
        shell: bash
        run: |
          python3 -m venv /tmp/ruins-restore-env
          /tmp/ruins-restore-env/bin/pip -q install brotli
          /tmp/ruins-restore-env/bin/python - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path
          import tarfile
          import brotli

          source = Path('metal-slug-2/bootstrap')
          encoded = ''.join((source / f'part-{i:02d}.txt').read_text().strip() for i in range(10))
          assert len(encoded) == 38060, 'Bundle size mismatch'
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'bdc30e5a91c0fcc87942967eea27a32edd651b2284ca1b7043f9932b49b7827b', 'Bundle checksum mismatch'
          original = brotli.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(original), mode='r:') as archive:
              for member in archive.getmembers():
                  assert member.isfile(), 'Only regular files may be unpacked'
                  assert member.name.startswith('metal-slug-2/') and '..' not in Path(member.name).parts
              archive.extractall('.')
          assert Path('metal-slug-2/engine.js').exists()
          assert Path('metal-slug-2/index.html').exists()
          print('Source restored and SHA-256 validated')
          PY
      - name: Test run-and-gun physics
        run: cd metal-slug-2 && npm test
      - name: Remove temporary transfer artifacts and commit source
        shell: bash
        run: |
          rm -rf metal-slug-2/bootstrap
          rm .github/workflows/ruins-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/ruins-bootstrap.yml metal-slug-2
          git add -A metal-slug-2
          git commit -m "feat: restore playable Egyptian arcade mission source" 
          git push origin HEAD:feature/ruins-of-second-sun
