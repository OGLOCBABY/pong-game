name: STRIKELINE Pages

on:
  workflow_run:
    workflows: ["STRIKELINE quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish only after a successful QA run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether owner has enabled GitHub Pages Actions source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)"
          if [ "$source_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled: publish from Actions."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: Pages is not configured for GitHub Actions yet."
            echo "Enable: Settings > Pages > Source > GitHub Actions."
            echo "No external service or repository was changed."
          fi
      - name: Check out only this repository
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Assemble dependency-free static site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p site/src
          cp index.html styles.css favicon.svg site/
          cp src/*.js site/src/
          touch site/.nojekyll
      - name: Prepare GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload only runtime site files
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
